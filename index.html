<!DOCTYPE html>
<html lang="pt-BR" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#09090b" />
  <title>Lunar OS — Inicialização</title>
  <meta name="description" content="Lunar OS — demo de Web OS. Fase 2: papel de parede procedural em Canvas, barra de tarefas com vidro fosco e menu Iniciar." />

  <!-- Tipografia: Plus Jakarta Sans (SIL OFL). Arquivos auto-hospedados para o boot não depender de rede. -->
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/lunar-boot.png" as="image" type="image/png" />

  <link rel="stylesheet" href="src/css/fonts.css?v=0.3.0" />
  <link rel="stylesheet" href="src/css/base.css?v=0.3.0" />
  <link rel="stylesheet" href="src/css/boot.css?v=0.3.0" />
  <link rel="stylesheet" href="src/css/desktop.css?v=0.3.0" />
  <link rel="stylesheet" href="src/css/taskbar.css?v=0.3.0" />

  <script>
    // Troca a flag antes da primeira pintura para evitar flash de conteúdo sem JS.
    document.documentElement.classList.replace('no-js', 'js');

    // ---------------------------------------------------------------
    // Rede de segurança do boot (script CLÁSSICO, de propósito).
    //
    // O controlador do boot é um módulo ES. Se o módulo não carregar —
    // navegador antigo sem `type="module"`, erro de sintaxe, import bloqueado
    // por política de rede, extensão interceptando, CDN/proxy caído — nada
    // acontece e a tela fica preta em "Iniciando" até o usuário clicar em
    // "Pular". Era exatamente esse o sintoma relatado.
    //
    // Este timer roda em um script clássico, avaliado antes do módulo, e não
    // depende de módulo nenhum: se aos 5 s o boot não tiver sinalizado vida
    // (data-boot-ready="1" é gravado no primeiro tick do controlador),
    // revelamos o desktop. O boot também tem o próprio watchdog interno;
    // este é o caso "o JS nem chegou a rodar".
    // ---------------------------------------------------------------
    (function () {
      var LIMIT_MS = 5000;
      var done = false;

      function bailOut() {
        if (done) return;
        var root = document.documentElement;
        // O controlador sinalizou vida: o boot é responsabilidade dele.
        if (root.dataset.bootReady === '1') {
          done = true;
          return;
        }
        done = true;

        root.classList.add('boot-fallback');

        var boot = document.getElementById('boot');
        var desktop = document.getElementById('desktop');
        if (boot) {
          boot.classList.add('is-gone');
          boot.setAttribute('aria-hidden', 'true');
        }
        if (desktop) {
          desktop.classList.add('is-visible');
          desktop.removeAttribute('aria-hidden');
        }
        document.body.classList.remove('is-booting');
        document.title = 'Lunar OS — Área de trabalho';
        console.warn(
          'Lunar OS · o controlador do boot não iniciou em ' +
            LIMIT_MS +
            ' ms — revelando a área de trabalho sem animação.'
        );
      }

      // `load` é o marco real: aí sim dá para exigir que o módulo já rodou.
      window.addEventListener('load', function () {
        window.setTimeout(bailOut, LIMIT_MS);
      });

      // Se a página nem chegar a `load` (recurso pendurado), este timer ainda
      // dispara — um boot travado nunca pode durar mais que isso.
      window.setTimeout(bailOut, LIMIT_MS * 2);
    })();
  </script>
  <script type="module" src="src/js/main.js?v=0.3.0"></script>
</head>

<body class="is-booting">
  <a class="skip-link" href="#desktop">Ir para a área de trabalho</a>

  <!-- ======================================================================
       FASE 1 — Tela de boot
       ====================================================================== -->
  <section id="boot" class="boot" aria-label="Inicializando o Lunar OS">
    <div class="boot__stage">
      <!-- Só o ícone: fade-in suave, nada de moldura ou texto -->
      <img
        id="boot-logo"
        class="boot__logo"
        src="assets/lunar-boot.png"
        alt="Lunar"
        width="500" height="500"
        draggable="false"
        decoding="async"
      />

      <!-- Bolinhas girando: 8 pontos em CSS puro (sem canvas, sem imagem).
           --i posiciona cada ponto no anel; a animação roda no compositor,
           então funciona mesmo com aceleração de canvas indisponível. -->
      <div class="boot__loader">
        <div class="boot__dots" id="boot-dots" aria-hidden="true">
          <span class="boot__dot" style="--i: 0"></span>
          <span class="boot__dot" style="--i: 1"></span>
          <span class="boot__dot" style="--i: 2"></span>
          <span class="boot__dot" style="--i: 3"></span>
          <span class="boot__dot" style="--i: 4"></span>
          <span class="boot__dot" style="--i: 5"></span>
          <span class="boot__dot" style="--i: 6"></span>
          <span class="boot__dot" style="--i: 7"></span>
        </div>
        <p class="boot__status" id="boot-status" role="status" aria-live="polite">Iniciando</p>
      </div>
    </div>

    <div class="boot__foot">
      <p class="boot__build">lunar os · demo 0.3.0 · fase 2/3</p>
      <div class="boot__controls">
        <button class="boot__sound" id="boot-sound" type="button" data-state="pending">
          <span class="boot__sound-dot" aria-hidden="true"></span>
          <span class="boot__sound-label" id="boot-sound-label">Som: aguardando gesto</span>
        </button>
        <button class="boot__skip" id="boot-skip" type="button">Pular</button>
      </div>
    </div>
  </section>

  <!-- ======================================================================
       FASE 2 — Área de trabalho

       O esqueleto (barra, menu, relógio) está no HTML de propósito: se o
       módulo ES não carregar, a área de trabalho ainda aparece com a barra no
       lugar em vez de uma tela vazia. O JS só preenche as listas e liga os
       eventos — é hidratação, não construção.
       ====================================================================== -->
  <main id="desktop" class="desktop" aria-hidden="true" tabindex="-1">
    <!-- Papel de parede procedural: Canvas 2D desenhado por semente.
         Nenhum arquivo de imagem novo entra no projeto por causa dele. -->
    <canvas id="wallpaper" class="desktop__wallpaper" aria-hidden="true"></canvas>
    <div class="desktop__vignette" aria-hidden="true"></div>

    <!-- Atalhos da área de trabalho (preenchidos pelo desktop.js) -->
    <ul class="desktop__icons" id="desktop-icons" aria-label="Atalhos da área de trabalho"></ul>

    <!-- ================================================ menu Iniciar ===== -->
    <section
      class="startmenu"
      id="start-menu"
      role="dialog"
      aria-modal="false"
      aria-label="Menu Iniciar"
      aria-hidden="true"
    >
      <header class="startmenu__head">
        <form class="startmenu__search" id="start-search-form" role="search" autocomplete="off">
          <span class="startmenu__search-icon" aria-hidden="true" data-icon="search"></span>
          <input
            class="startmenu__search-input"
            id="start-search"
            type="search"
            placeholder="Buscar apps e ações"
            aria-label="Buscar aplicativos e ações do sistema"
            enterkeyhint="go"
            autocomplete="off"
            spellcheck="false"
          />
        </form>
      </header>

      <div class="startmenu__body" id="start-body">
        <p class="startmenu__section" id="start-section-title">Todos os aplicativos</p>
        <ul class="startmenu__grid" id="start-grid" role="list"></ul>
        <p class="startmenu__empty" id="start-empty" hidden>Nada encontrado.</p>
      </div>

      <footer class="startmenu__foot">
        <ul class="startmenu__actions" id="start-actions" role="list"></ul>
        <p class="startmenu__build">lunar os · demo <span id="start-build">0.3.0</span> · fase 2/3</p>
      </footer>
    </section>

    <!-- ============================================== barra de tarefas ==== -->
    <footer class="taskbar" id="taskbar" aria-label="Barra de tarefas">
      <button
        class="taskbar__start"
        id="start-button"
        type="button"
        aria-expanded="false"
        aria-controls="start-menu"
      >
        <span class="taskbar__start-icon" aria-hidden="true">
          <img
            class="taskbar__start-logo"
            id="start-logo"
            src="assets/lunar-logo.png"
            alt=""
            width="1024"
            height="1024"
            decoding="async"
            draggable="false"
          />
          <span class="taskbar__start-fallback" data-icon="moon"></span>
        </span>
        <span class="taskbar__start-label">Iniciar</span>
      </button>

      <ul class="taskbar__apps" id="taskbar-apps" aria-label="Aplicativos fixados"></ul>

      <button class="taskbar__search" id="search-button" type="button" aria-label="Buscar (abre o menu Iniciar)">
        <span class="taskbar__search-icon" aria-hidden="true" data-icon="search"></span>
        <span class="taskbar__search-label">Buscar</span>
      </button>

      <div class="taskbar__tray">
        <button class="taskbar__tray-btn" id="tray-sound" type="button" aria-pressed="true">
          <span class="taskbar__tray-icon" aria-hidden="true" data-icon="volume"></span>
          <span class="taskbar__tray-label" id="tray-sound-label">Som</span>
        </button>

        <div class="taskbar__clock" id="taskbar-clock">
          <time class="taskbar__time" id="clock-time" datetime="">--:--</time>
          <span class="taskbar__date" id="clock-date">—</span>
        </div>
      </div>
    </footer>

    <!-- Avisos temporários (apps das fases seguintes, ações do sistema) -->
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <!-- Painel "Sobre o Lunar" — o único app já aberto pela Fase 2 -->
    <div class="sheet" id="about-sheet" role="dialog" aria-modal="true" aria-labelledby="about-title" hidden>
      <div class="sheet__backdrop" data-sheet-close></div>
      <div class="sheet__panel">
        <header class="sheet__head">
          <span class="sheet__icon" aria-hidden="true" data-icon="moon"></span>
          <h2 class="sheet__title" id="about-title">Sobre o Lunar</h2>
          <button class="sheet__close" type="button" data-sheet-close aria-label="Fechar">
            <span aria-hidden="true">×</span>
          </button>
        </header>
        <div class="sheet__body" id="about-body"></div>
      </div>
    </div>

    <noscript>
      <p class="desktop__noscript">O Lunar OS precisa de JavaScript habilitado para desenhar a interface e sintetizar o áudio.</p>
    </noscript>
  </main>
</body>
</html>
