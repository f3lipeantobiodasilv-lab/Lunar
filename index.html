<!DOCTYPE html>
<html lang="pt-BR" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#09090b" />
  <title>Lunar OS — Inicialização</title>
  <meta name="description" content="Lunar OS — demo de Web OS. Fase 1: tela de boot com bolinhas em CSS puro e som sintetizado." />

  <!-- Tipografia: Plus Jakarta Sans (SIL OFL). Arquivos auto-hospedados para o boot não depender de rede. -->
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/lunar-boot.png" as="image" type="image/png" />

  <link rel="stylesheet" href="src/css/fonts.css?v=0.2.5" />
  <link rel="stylesheet" href="src/css/base.css?v=0.2.5" />
  <link rel="stylesheet" href="src/css/boot.css?v=0.2.5" />
  <link rel="stylesheet" href="src/css/desktop.css?v=0.2.5" />

  <script>
    // Troca a flag antes da primeira pintura para evitar flash de conteúdo sem JS.
    document.documentElement.classList.replace('no-js', 'js');

    // ---------------------------------------------------------------
    // Rede de segurança do boot (script CLÁSSICO, de propósito).
    //
    // O controlador do boot é um módulo ES. Se o módulo não carregar —
    // navegador antigo sem `type="module"`, erro de sintaxe, import bloqueado
    // por política de rede, extensão interceptando, CDN/proxy caído — nada
    // acontece e a tela fica preta em "Iniciando" até o usuário clicar em
    // "Pular". Era exatamente esse o sintoma relatado.
    //
    // Este timer roda em um script clássico, avaliado antes do módulo, e não
    // depende de módulo nenhum: se aos 5 s o boot não tiver sinalizado vida
    // (data-boot-ready="1" é gravado no primeiro tick do controlador),
    // revelamos o desktop. O boot também tem o próprio watchdog interno;
    // este é o caso "o JS nem chegou a rodar".
    // ---------------------------------------------------------------
    (function () {
      var LIMIT_MS = 5000;
      var done = false;

      function bailOut() {
        if (done) return;
        var root = document.documentElement;
        // O controlador sinalizou vida: o boot é responsabilidade dele.
        if (root.dataset.bootReady === '1') {
          done = true;
          return;
        }
        done = true;

        root.classList.add('boot-fallback');

        var boot = document.getElementById('boot');
        var desktop = document.getElementById('desktop');
        if (boot) {
          boot.classList.add('is-gone');
          boot.setAttribute('aria-hidden', 'true');
        }
        if (desktop) {
          desktop.classList.add('is-visible');
          desktop.removeAttribute('aria-hidden');
        }
        document.body.classList.remove('is-booting');
        document.title = 'Lunar OS — Área de trabalho';
        console.warn(
          'Lunar OS · o controlador do boot não iniciou em ' +
            LIMIT_MS +
            ' ms — revelando a área de trabalho sem animação.'
        );
      }

      // `load` é o marco real: aí sim dá para exigir que o módulo já rodou.
      window.addEventListener('load', function () {
        window.setTimeout(bailOut, LIMIT_MS);
      });

      // Se a página nem chegar a `load` (recurso pendurado), este timer ainda
      // dispara — um boot travado nunca pode durar mais que isso.
      window.setTimeout(bailOut, LIMIT_MS * 2);
    })();
  </script>
  <script type="module" src="src/js/main.js?v=0.2.5"></script>
</head>

<body class="is-booting">
  <a class="skip-link" href="#desktop">Ir para a área de trabalho</a>

  <!-- ======================================================================
       FASE 1 — Tela de boot
       ====================================================================== -->
  <section id="boot" class="boot" aria-label="Inicializando o Lunar OS">
    <div class="boot__stage">
      <!-- Só o ícone: fade-in suave, nada de moldura ou texto -->
      <img
        id="boot-logo"
        class="boot__logo"
        src="assets/lunar-boot.png"
        alt="Lunar"
        width="500" height="500"
        draggable="false"
        decoding="async"
      />

      <!-- Bolinhas girando: 8 pontos em CSS puro (sem canvas, sem imagem).
           --i posiciona cada ponto no anel; a animação roda no compositor,
           então funciona mesmo com aceleração de canvas indisponível. -->
      <div class="boot__loader">
        <div class="boot__dots" id="boot-dots" aria-hidden="true">
          <span class="boot__dot" style="--i: 0"></span>
          <span class="boot__dot" style="--i: 1"></span>
          <span class="boot__dot" style="--i: 2"></span>
          <span class="boot__dot" style="--i: 3"></span>
          <span class="boot__dot" style="--i: 4"></span>
          <span class="boot__dot" style="--i: 5"></span>
          <span class="boot__dot" style="--i: 6"></span>
          <span class="boot__dot" style="--i: 7"></span>
        </div>
        <p class="boot__status" id="boot-status" role="status" aria-live="polite">Iniciando</p>
      </div>
    </div>

    <div class="boot__foot">
      <p class="boot__build">lunar os · demo 0.2.5 · fase 1/3</p>
      <div class="boot__controls">
        <button class="boot__sound" id="boot-sound" type="button" data-state="pending">
          <span class="boot__sound-dot" aria-hidden="true"></span>
          <span class="boot__sound-label" id="boot-sound-label">Som: aguardando gesto</span>
        </button>
        <button class="boot__skip" id="boot-skip" type="button">Pular</button>
      </div>
    </div>
  </section>

  <!-- ======================================================================
       Área de trabalho — placeholder da Fase 1 (recebe as Fases 2 e 3)
       ====================================================================== -->
  <main id="desktop" class="desktop" aria-hidden="true" tabindex="-1">
    <div class="desktop__scrim" aria-hidden="true"></div>

    <div class="desktop__placeholder">
      <img class="desktop__placeholder-logo" src="assets/lunar-logo.png" alt="" width="1024" height="1024" draggable="false" />
      <h1 class="desktop__title">Lunar</h1>
      <p class="desktop__lede">Boot concluído. O ambiente de trabalho entra na Fase&nbsp;2.</p>

      <ul class="desktop__next">
        <li><span>Fase 2</span> Papel de parede procedural, barra de tarefas e menu Iniciar</li>
        <li><span>Fase 3</span> Motor de janelas e terminal com sistema de arquivos em tmp/</li>
      </ul>

      <div class="desktop__actions">
        <button class="ui-button ui-button--primary" id="replay-boot" type="button">Repetir boot</button>
        <button class="ui-button" id="desktop-sound" type="button">Testar som do sistema</button>
      </div>
    </div>

    <noscript>
      <p class="desktop__noscript">O Lunar OS precisa de JavaScript habilitado para desenhar a interface e sintetizar o áudio.</p>
    </noscript>
  </main>
</body>
</html>
